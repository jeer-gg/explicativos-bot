# Configuración del bot de videos explicativos.
# Puedes editar este archivo desde el iPhone en github.com (botón del lápiz).

canal:
  nombre: "Explicativos de la vida cotidiana"
  idioma: "español latino neutro, cercano, con humor ligero"
  publico: "adultos de 25 a 55 años en Latinoamérica y República Dominicana"
  # Subtemas que el director rota. Puedes añadir o quitar.
  subtemas:
    - "ciencia de cosas cotidianas (cocina, casa, clima)"
    - "el cuerpo humano en el día a día (sin consejos médicos)"
    - "el dinero en la vida diaria (inflación, intereses, precios)"
    - "por qué las cosas son como son (diseños, costumbres, objetos)"
    - "psicología cotidiana (hábitos, memoria, decisiones)"
    - "tecnología que usamos sin entender (celular, wifi, GPS)"
  # Temas de actualidad: una vez al día el bot hace un recuento de lo que está en tendencia y
  # saca preguntas relacionadas que la gente se hace; los videos del día salen de esa lista.
  tendencias:
    activo: true
    por_cada_clasico: 2   # cada día: 2 de actualidad por cada clásico (con 3 al día: 2 + 1, cerca del 70/30)
    paises: ["el mundo entero", "toda Latinoamérica", "los hispanos de Estados Unidos y España"]
  # Temas prohibidos: el director nunca los elegirá.
  prohibidos:
    - "consejos médicos, dosis o tratamientos"
    - "política partidista"
    - "tragedias, muertes, crímenes o desastres con víctimas"
    - "religión"
    - "consejos de inversión concretos"

produccion:
  # Duración objetivo del Reel en segundos (Facebook acepta de 3 a 90).
  duracion_min: 40   # orientativo: el guion dura lo que la explicación necesita, sin relleno
  duracion_max: 70
  escenas_min: 10   # en los videos ganadores cambia algo cada 3 a 4 segundos
  escenas_max: 14
  # Voces gratis de Edge TTS. Ejemplos: es-MX-JorgeNeural, es-MX-DaliaNeural,
  # es-DO-EmilioNeural, es-DO-RamonaNeural, es-US-AlonsoNeural
  voz: "es-MX-DaliaNeural"        # voz de respaldo (Edge), femenina como la principal
  velocidad_voz: "+15%"          # solo para la voz de respaldo (Edge)
  # Voz principal: Google Gemini (gratis con la clave GEMINI_API_KEY de Google AI Studio)
  voz_motor: "gemini"             # "gemini" o "edge"
  # Voz de marca: se diseña UNA vez con Gemini (Voice Design) y es la misma en todos los videos.
  # Si cambias la descripción, el bot diseña una nueva y te manda la muestra por Telegram.
  voz_marca:
    activa: true
    nombre: "Narradora del canal"
    genero: "female"
    tono: "medium"
    idioma: "es-419"
    acento: "Latin American neutral Spanish, Caribbean warmth, no strong regional accent"
    persona: "Popular science explainer and storyteller in her early thirties"
    contexto: "Narration for short viral explainer videos about everyday science"
    descripcion: >
      A warm, bright and confident female narrator in her early thirties speaking neutral
      Latin American Spanish. Friendly and close, like a smart friend telling you a secret
      you will love. Clear diction, medium pitch, natural smile in the voice, energetic but
      never shouting, fast and fluid pace with expressive intonation and real curiosity.
  voz_gemini: "Laomedeia"         # voz fija de reserva si la voz de marca no estuviera disponible
  # Siempre el mismo modelo para que la voz suene igual; los otros solo si el primero falla.
  modelos_voz_gemini: ["gemini-3.8-flash-tts", "gemini-3.1-flash-tts-preview", "gemini-2.5-flash-preview-tts"]
  estilo_voz_gemini: >
    Narra como una divulgadora de videos virales en español latinoamericano neutro: cercana,
    cálida y con sonrisa en la voz, como quien le cuenta a un amigo algo fascinante. Arranca
    la primera frase con energía y sorpresa. Ritmo rápido y continuo, sin pausas largas.
    Sube la intensidad en los datos sorprendentes, baja un poco y hazlo íntimo antes de la
    respuesta, y remata con énfasis. Lee exactamente este texto, sin añadir ni quitar palabras:
  whisper_modelo: "base"          # para saber en qué momento se dice cada palabra
  # Animación: "3d" (escenas 3D con luces y sombras) o "2d" (ilustración plana)
  motor: "3d"
  # true = todo el video pasa en UN mundo que evoluciona (el objeto se arma, se llena, falla,
  # se arregla), como los Reels 3D con millones de vistas. false = un escenario por escena.
  mundo_continuo: true
  # Turnos de producción (hora de RD). El bot trabaja en cadena: hace el video de cada turno y
  # espera al siguiente. Separados 6 horas para que cada video tenga su propio límite de Claude.
  horas_produccion: ["03:17", "09:17", "15:17"]
  concurrencia_3d: "50%"
  tiempo_maximo_min: 170          # debe ser menor que timeout-minutes del trabajo producir
  # Dos versiones del gancho (A y B) para que elijas la mejor.
  ab_gancho: false   # una sola versión, con todo el esfuerzo puesto en ella
  # Música de fondo: pon un .mp3 con licencia en remotion/public/musica/ y
  # escribe aquí su nombre (por ejemplo "fondo.mp3"). Vacío = sin música.
  musica: ""
  # Música de fondo con "ducking" (baja sola cuando habla la voz): sube 2 o 3 pistas sin derechos
  # (por ejemplo de la Biblioteca de audio de YouTube) a remotion/public/musica/ y se van rotando.
  volumen_musica: 0.16
  # Texto en pantalla para quien ve sin sonido.
  subtitulos: true
  # "concepto" = solo el concepto de cada momento en grande arriba («EL FLOTADOR», «NO SUBE
  # SOLA»), palabra por palabra cuando la voz lo dice (estilo de los videos ganadores).
  # "completo" = subtítulos de toda la narración, de 3 en 3 palabras.
  subtitulos_estilo: "concepto"

estilo:
  descripcion: >
    Ilustración vectorial plana pero elaborada, al estilo de los videos
    explicativos animados en español tipo "La Ciencia de lo Obvio" y "Píldora
    Plasaber": personajes simpáticos con contorno grueso, fondos con detalles,
    sombras planas, todo en movimiento suave. Sin emojis. Sin párrafos de texto
    en pantalla. Gráfico, claro y fiel a la realidad.
  descripcion_3d: >
    Estilo de marca del canal: 3D ilustrado con contornos negros finos de dibujo y sombreado
    de caricatura, como los Reels 3D con millones de vistas. Lo que más importa es que se vea
    HERMOSO y rico: cada fotograma lleno, con un escenario que va con el tema (cielo con nubes y
    pasto, una azotea o calle de día, un escenario oscuro con foco, o un estudio limpio) y un
    protagonista grande que contrasta con el fondo (color fuerte y limpio sobre un fondo más
    calmado). La parte de la que se habla se resalta con un color vivo. Luz clara y bonita,
    sombras suaves, colores limpios y fieles a la realidad. Objetos fieles a la realidad, sin
    ojos ni caras. Personajes solo si son parte de la historia. Etiquetas cortas, medidas,
    flechas de fuerza, líneas punteadas de trayectoria. Cámara cercana que se mueve; un plano
    abierto solo para ubicar. Sin emojis.
  # Paletas para 3D (fondo oscuro, texto claro; acentos: protagonista, gente, luz, extra).
  # Estilo de marca ÚNICO para todos los videos (no se sortea): así la gente reconoce el canal.
  paletas_3d:  # cielo, texto, [objeto principal, secundario, resalte, extra, suelo]
    # Estudio neutro (fondo gris cálido, suelo greige) y colores apagados; un solo resalte fuerte.
    # Medido en los videos de ejemplo: brillo medio ~0,58, saturación ~0,3, solo ~3 % de píxeles muy saturados.
    marca: ["#D3CEC6", "#1B1B1F", "#D2452F", "#E9E4DB", "#A3D92B", "#E0A526", "#C2BBAF"]
  # Paletas para 2D (fondo, tinta, 4 colores de acento).
  paletas:
    calida:   ["#FFF4E0", "#1E1B2E", "#FF6B35", "#F7B32B", "#2EC4B6", "#E71D36"]
    fresca:   ["#E8F6F3", "#14213D", "#00A6A6", "#F49D37", "#EF3E36", "#5C80BC"]
    papel:    ["#F5EFE6", "#22223B", "#E07A5F", "#3D405B", "#81B29A", "#F2CC8F"]
    noche:    ["#1B263B", "#F1FAEE", "#FFB703", "#FB8500", "#8ECAE6", "#E63946"]
    pastel:   ["#FDF6FF", "#2B2D42", "#B388EB", "#FF8FAB", "#72DDF7", "#FFD166"]

ganchos:
  # Tipos de gancho que se sortean para el primer segundo.
  tipos:
    - "pregunta que todos se han hecho"
    - "dato sorprendente con número"
    - "afirmación que parece falsa pero es cierta"
    - "situación cotidiana con giro inesperado"
    - "error común que casi todos cometen"
    - "título que niega lo obvio («esto NO está de adorno»)"
    - "advertencia directa («si te pasa X, NO hagas Y»)"
    - "comparación imposible con número («va más lento que un tren»)"
    - "te mintieron («Te mintieron: casi nadie se fija en ti»)"
    - "ya lo tienes, pero falta algo («Ya tienes un avión… pero así no vuela»)"
  # Formatos ganadores (sacados de Reels con cientos de miles de vistas). Se sortea uno por video.
  estructuras:
    - "NO ESTÁ DE ADORNO: un detalle de un objeto cotidiano que parece decoración pero cumple una función clave; se muestra el objeto, se quita el detalle, se ve qué pasaría sin él y se explica por qué está ahí"
    - "PIEZA POR PIEZA: se construye desde cero un objeto o lugar cotidiano, pieza por pieza, explicando para qué sirve cada parte y qué pasaría si faltara"
    - "MITO TACHADO: lo que casi todos hacen mal ante una situación cotidiana, cada mito se tacha con su razón, y al final lo que de verdad funciona"
    - "CON NÚMEROS: una comparación con números grandes en pantalla (barras que crecen, contadores, medidas) que cambia cómo ves algo cotidiano"
    - "POR DENTRO: vista en corte de algo cotidiano para ver lo que pasa adentro (aire, agua, fuerzas, calor) con flechas que lo muestran"
    - "HISTORIA EN PARTES: una historia real e intrigante detrás de algo cotidiano (un invento por accidente, un error que cambió todo, un misterio con explicación científica) contada en 2 o 3 partes; cada parte responde su propia pregunta y termina con una intriga que lleva a la siguiente"
    - "LA MISMA IDEA: cómo un objeto evolucionó desde su versión más antigua hasta la que usas hoy, mostrando que el principio es el mismo"
    - "DE LO MÍNIMO A LO REAL: arranca con la versión más simple posible del objeto («ya tienes un avión: una tabla con un palo»); cada frase muestra un problema, el fallo exagerado, y la pieza real que lo resuelve se agrega con su nombre; al final, el objeto completo funcionando"
    - "SIGUE EL CAMINO: se recorre un sistema cotidiano de principio a fin en un solo mundo en corte (el agua desde la calle hasta tu llave, la luz desde el poste hasta el foco); cada tramo agrega una pieza con su nombre y lo que pasaría sin ella"

series:
  # Continuación automática: si un video saca este múltiplo de las vistas normales, se hace su parte 2.
  multiplo_exito: 2.5
  minimo_videos_para_comparar: 6
  # Historias en partes: como mucho una serie nueva cada estos días, y una parte por día.
  dias_entre_series: 4

aprobacion:
  # true = te llega a Telegram y tú decides. false = publica solo (versión A).
  activa: false   # false = el bot publica solo en los horarios de abajo
  escuchar_minutos: 30  # minutos que el bot espera tu botón para publicar al instante

publicacion:
  # Horas a las que se publica (hora de República Dominicana). Basado en estudios de 2026:
  # mañana temprano, mediodía y noche son los picos de actividad en Facebook.
  horarios: ["09:00", "13:00", "20:00"]
  zona_horaria: "America/Santo_Domingo"
  hashtags: ["#ciencia", "#curiosidades", "#aprende", "#explicacion"]

claude:
  # Modelo para ideas, guion y revisión.
  modelo: "claude-sonnet-5-5"
  # Modelo para dibujar las escenas (más capaz = mejor ilustración).
  modelo_escenas: "claude-opus-5-5"
  # Búsqueda web para verificar datos (recomendado).
  busqueda_web: true
  # Tope de llamadas a la API por video, para controlar el gasto.
  max_llamadas: 75
  # Rondas máximas en que el revisor puede pedir rehacer escenas.
  rondas_revision: 3
  nota_minima: 7
  # En modo automático todos los videos se programan solos. Si pones un número (por ejemplo 6.5),
  # los que saquen menos te llegarán a Telegram para decidir en vez de publicarse solos.
  nota_para_publicar: 0
  # Un video que sale roto (escenas vacías, nota del revisor por debajo de esto) no se publica:
  # se descarta y se hace otro para ese horario.
  nota_para_descartar: 3   # solo se descarta lo roto (escenas vacías); con 4.5 o 5 se publica igual
  descartes_por_dia: 2   # como mucho se rehacen 2 videos descartados por día (cuida el límite de Claude)
  # Si el control final encuentra un error grave (voz que empieza tarde, dato falso, texto tapado),
  # el bot lo arregla solo: rehace la voz o las escenas afectadas, vuelve a revisar y publica.
  intentos_arreglo: 2
  # true = si tras los intentos aún queda algún error, se publica igual (no te pregunta).
  publicar_si_no_se_arregla: true
